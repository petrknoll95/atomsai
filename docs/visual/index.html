<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AtomsAI — Visual comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#173e33;font:15px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:1;background:#f4f4f1ed;padding:20px 28px;border-bottom:1px solid #ccd7d1;backdrop-filter:blur(16px)}h1{font-size:20px;margin:0 0 5px}p{margin:0}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}button,select{font:inherit;color:inherit;border:1px solid #bccdc4;background:white;padding:8px 12px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#173e33;color:white}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #79519a;outline-offset:3px}label{margin-left:8px}main{overflow:auto;padding:24px}img{display:block;width:1600px;max-width:100%;height:auto;margin:auto;box-shadow:0 0 0 1px #ccc}.actual img{max-width:none}#metrics{font-size:13px;margin-top:10px;color:#526c60}a{color:inherit}
</style>
<header><h1>AtomsAI — original and browser comparison</h1><p>Original Figma export and production Chromium render. Overlay is 50%; difference is amplified 4×.</p>
<nav aria-label="Comparison controls"><select id="section" aria-label="Section"><option value="full">Full homepage</option><option value="hero">hero</option><option value="offerings">offerings</option><option value="applications">applications</option><option value="preview">preview</option><option value="industries">industries</option><option value="stories">stories</option><option value="faq">faq</option><option value="cta">cta</option><option value="footer">footer</option></select><button data-mode="reference">Figma</button><button data-mode="rendered">Browser</button><button data-mode="overlay" aria-pressed="true">Overlay</button><button data-mode="difference">Difference ×4</button><label><input type="checkbox" id="actual"> Actual pixels</label><a href="README.md">Verification notes</a></nav><p id="metrics"></p></header>
<main><img id="comparison" src="comparison/overlay.png" alt="Aligned Figma and browser homepage overlay"></main>
<script>
const report=[{"section":"hero","meanAbsoluteChannelError":0.867828125,"pixelsOver32Percent":0.8059244791666667},{"section":"offerings","meanAbsoluteChannelError":2.899388968140751,"pixelsOver32Percent":0.18429029957203993},{"section":"applications","meanAbsoluteChannelError":0.5624187892211148,"pixelsOver32Percent":0.5960686600221484},{"section":"preview","meanAbsoluteChannelError":0.8311963626030122,"pixelsOver32Percent":0.5363384484228474},{"section":"industries","meanAbsoluteChannelError":3.4798992732147895,"pixelsOver32Percent":2.882461896697714},{"section":"stories","meanAbsoluteChannelError":2.245381080316742,"pixelsOver32Percent":0.8905542986425339},{"section":"faq","meanAbsoluteChannelError":0.592934231069477,"pixelsOver32Percent":0.678132318501171},{"section":"cta","meanAbsoluteChannelError":0.8420273042929293,"pixelsOver32Percent":0.12571022727272727},{"section":"footer","meanAbsoluteChannelError":0.5896860328638498,"pixelsOver32Percent":0.6722951344430218}];let mode='overlay';const section=document.querySelector('#section');const picture=document.querySelector('#comparison');
function update(){const key=section.value;const files={reference:'reference/homepage.png',rendered:'rendered/homepage-1600.png',overlay:'comparison/overlay.png',difference:'comparison/difference-x4.png'};picture.src=key==='full'?files[mode]:'comparison/'+key+'-'+mode+'.png';picture.alt=key+' — '+mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));const row=report.find(r=>r.section===key);document.querySelector('#metrics').textContent=row?'Mean absolute RGB channel error: '+row.meanAbsoluteChannelError.toFixed(3)+' / 255. Pixels with any channel difference >32: '+row.pixelsOver32Percent.toFixed(3)+'%.':'1600 × 7966 pixels; source frame height 7965.0908px. Full source and measured section geometry are retained in results.json.';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;update()});section.onchange=()=>{update();window.scrollTo(0,0)};document.querySelector('#actual').onchange=e=>document.querySelector('main').classList.toggle('actual',e.target.checked);update();
</script></html>

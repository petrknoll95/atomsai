<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homepage procedural patterns</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#27433b;font:14px/1.5 system-ui}header{padding:24px;border-bottom:1px solid #b6c4be}h1{font-size:24px;margin:0}p{margin:8px 0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}select,button{font:inherit;padding:8px 12px;border:1px solid #b6c4be;border-radius:8px;background:white;color:inherit}button[aria-pressed=true]{background:#27433b;color:white}a{color:inherit}:focus-visible{outline:2px solid #8c78b0;outline-offset:3px}main{padding:24px;overflow:auto}img{display:block;margin:auto;max-width:100%;height:auto}main.actual img{max-width:none}</style>
<header><h1>Homepage: original artwork and live shaders</h1><p>Seven original crops, both browsers. Overlay 50%; difference amplified 8×. No alignment correction or rescaling.</p><nav aria-label="Comparison controls"><select id="application" aria-label="Homepage application"><option>offerings-drift</option><option>offerings-concentric</option><option>offerings-band</option><option>applications-concentric</option><option>preview-drift</option><option>preview-concentric</option><option>cta-pattern</option></select><select id="engine" aria-label="Browser"><option>chromium</option><option>webkit</option></select><button data-mode="reference">Figma</button><button data-mode="rendered">Shader</button><button data-mode="overlay">Overlay</button><button data-mode="difference">Difference ×8</button><label><input id="actual" type="checkbox">Actual pixels</label></nav><p id="metrics"></p><a href="README.md">Implementation and verification</a></header><main><img id="image" alt=""></main>
<script>const results=[{"key":"offerings-drift","engine":"chromium","width":480,"height":553,"meanAbsoluteChannelError":0.5742101165360659,"p99MaximumPixelError":3},{"key":"offerings-concentric","engine":"chromium","width":480,"height":553,"meanAbsoluteChannelError":0.7040825296363271,"p99MaximumPixelError":3},{"key":"offerings-band","engine":"chromium","width":480,"height":553,"meanAbsoluteChannelError":0.7112392003214788,"p99MaximumPixelError":3},{"key":"applications-concentric","engine":"chromium","width":352,"height":352,"meanAbsoluteChannelError":0.5697098829201102,"p99MaximumPixelError":6},{"key":"preview-drift","engine":"chromium","width":992,"height":640,"meanAbsoluteChannelError":0.5330676663306452,"p99MaximumPixelError":3},{"key":"preview-concentric","engine":"chromium","width":480,"height":640,"meanAbsoluteChannelError":0.5150249565972222,"p99MaximumPixelError":2},{"key":"cta-pattern","engine":"chromium","width":720,"height":368,"meanAbsoluteChannelError":0.7177334943639292,"p99MaximumPixelError":10},{"key":"offerings-drift","engine":"webkit","width":480,"height":553,"meanAbsoluteChannelError":0.5704365079365079,"p99MaximumPixelError":3},{"key":"offerings-concentric","engine":"webkit","width":480,"height":553,"meanAbsoluteChannelError":0.7025944343982319,"p99MaximumPixelError":3},{"key":"offerings-band","engine":"webkit","width":480,"height":553,"meanAbsoluteChannelError":0.7218090717299578,"p99MaximumPixelError":3},{"key":"applications-concentric","engine":"webkit","width":352,"height":352,"meanAbsoluteChannelError":0.5157379907024794,"p99MaximumPixelError":4},{"key":"preview-drift","engine":"webkit","width":992,"height":640,"meanAbsoluteChannelError":0.5262915826612903,"p99MaximumPixelError":3},{"key":"preview-concentric","engine":"webkit","width":480,"height":640,"meanAbsoluteChannelError":0.5122113715277777,"p99MaximumPixelError":2},{"key":"cta-pattern","engine":"webkit","width":720,"height":368,"meanAbsoluteChannelError":0.7174705615942029,"p99MaximumPixelError":10}];const app=document.querySelector('#application'),engine=document.querySelector('#engine'),img=document.querySelector('#image');let mode='overlay';function update(){const key=app.value,b=engine.value,row=results.find(r=>r.key===key&&r.engine===b);img.src=mode==='reference'?'reference/'+key+'.png':mode==='rendered'?'rendered/'+key+'-'+b+'.png':'comparison/'+key+'-'+b+'-'+mode+'.png';img.alt=key+' '+b+' '+mode;document.querySelector('#metrics').textContent=row.width+' × '+row.height+' · Mean absolute channel error '+row.meanAbsoluteChannelError.toFixed(4)+' / 255 · 99th percentile pixel error '+row.p99MaximumPixelError;document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));}app.onchange=engine.onchange=update;document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;update()});document.querySelector('#actual').onchange=e=>document.querySelector('main').classList.toggle('actual',e.target.checked);update();</script></html>
